<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맛집 목록</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }
    body { background-color: white; font-family: sans-serif; }

    header {
      width: 100%;
      display: flex;
      background-color: rgb(247, 168, 210);
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
    }
    .left { display: flex; align-items: center; gap: 8px; }

    nav {
      background-color: rgb(247, 168, 210);
      display: flex;
      border-top: 1px solid rgba(200, 100, 160, 0.3);
      border-bottom: 1px solid rgba(200, 100, 160, 0.3);
      margin-bottom: 10px;
    }
    nav a { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; border-right: 1px solid rgba(200, 100, 160, 0.4); transition: background-color 0.2s; }
    nav a:last-child { border-right: none; }
    nav a:hover { background-color: rgba(200, 100, 160, 0.15); }

    /* 텍스트 둥실둥실 애니메이션 */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    /* 텍스트 색상 변화 애니메이션 */
    @keyframes colorshift {
      0%   { color: rgba(200, 100, 160, 0.5); }
      50%  { color: rgba(247, 168, 210, 1); }
      100% { color: rgba(200, 100, 160, 0.5); }
    }

    /* 페이지 페이드인 */
    @keyframes fadein {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 400px;
      font-size: 32px;
      animation: float 3s ease-in-out infinite, colorshift 3s ease-in-out infinite;
    }

    main {
      animation: fadein 0.6s ease-out;
    }

    footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 20px;
      background-color: rgb(247, 168, 210);
      border-top: 1px solid rgba(200, 100, 160, 0.4);
      margin-top: 60px;
      animation: fadein 0.8s ease-out;
    }
    footer p { font-size: 12px; padding: 4px 0; }
    footer div { border-right: 1px solid rgba(200, 100, 160, 0.4); padding: 0 20px; }
    footer div:last-child { border-right: none; }
  </style>
</head>
<body>
  <header>
    <div class="left">
      <img src="./spring3.png" alt="" style="height:50px;">맛집소개
    </div>
    <div>비어있으면 심심하죠?</div>
  </header>
  <nav>
    <a href="./main.html">첫페이지</a>
    <a href="./맛집list.html">맛집 목록</a>
    <a href="./review.html">지역별 리뷰</a>
  </nav>
  <main>
    <div class="empty">비어있으면 심심하죠?ㄹㅇㅋㅋ</div>
  </main>
  <footer>
    <div style="padding-left:20px;">
      <div>맛집소개</div>
      <p>천안 맛집 큐레이션 서비스</p>
    </div>
    <div>
      <p>대표 : 김맛집 | 사업자등록번호 : 123-45-67890</p>
      <p>주소 : 충남 천안시 동남구 터미널3길 24</p>
      <p>고객센터 : 02-1234-5678 | matzip@example.com</p>
    </div>
    <div>
      <p>이용약관 | 개인정보처리방침 | 문의하기</p>
      <p>© 2026 맛집소개. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
