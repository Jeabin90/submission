<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맛집 목록</title>
  <style>
    @font-face {
      font-family: 'GMarketSans';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');
      font-weight: 300;
      font-display: swap;
    }

    @font-face {
      font-family: 'GMarketSans';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: 'GMarketSans';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
      font-weight: 700;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      font-family: 'GMarketSans', sans-serif;
      margin: 0;
      padding: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

   

    header {
      width: 100%;
      display: flex;
      background-color: rgb(247, 168, 210);
      justify-content: space-between;
      align-items: center;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav {
      background-color: rgb(247, 168, 210);
      margin-bottom: 10px;
      display: flex;
      border-top: 1px solid rgba(200, 100, 160, 0.3);
      border-bottom: 1px solid rgba(200, 100, 160, 0.3);
    }

    nav a {
      flex: 1;
      text-align: center;
      padding: 0 16px ;
      border-right: 1px solid rgba(200, 100, 160, 0.4);
    }

    nav a:last-child {
      border-right: none;
    }

    nav a:hover {
      background-color: rgba(200, 100, 160, 0.15);
    }

     body {
      background-color: white;
    }

   
    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-12px);
      }
    }

   
    @keyframes colorshift {
      0% {
        color: rgba(200, 100, 160, 0.5);
      }

      50% {
        color: rgba(247, 168, 210, 1);
      }

      100% {
        color: rgba(200, 100, 160, 0.5);
      }
    }

  
   

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 400px;
      font-size: 32px;
      animation: float 3s ease-in-out infinite, colorshift 3s ease-in-out infinite;
    }

    main {
      animation: fadein 0.6s ease-out;
    }

    footer {
      text-align: center;
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 20px;
      background-color: rgb(247, 168, 210);
      border-top: 1px solid rgba(200, 100, 160, 0.4);
      margin-top: 60px;
      animation: fadein 0.8s ease-out;
    }
     .footer-left {
            padding-left: 20px;
        }

    footer p {
      font-size: 12px;
      padding: 4px 0;
    }

    footer div {
      border-right: 1px solid rgba(200, 100, 160, 0.4);
    }

    footer div:last-child {
      border-right: none;
    }

    @media (max-width:640px) {
      .something1 {
        display: none;
      }

     .empty{
      font-size: 20px;
     }

      footer {
        flex-direction: column;

        gap: 12px;
      }

      footer div {
        border-right: none;
        border-bottom: px solid rgba(200, 100, 160, 0.4);
      }

      footer div:last-child {
        border-right: none;
      }

    }
  </style>
</head>

<body>
  <header>
    <div class="left">
      <img src="./spring3.png" alt="" style="height:50px;">맛집소개
    </div>
    <div class="something1">비어있으면 심심하죠?</div>
  </header>
  <nav>
    <a href="./index.html">첫페이지</a>
    <a href="./index.html">맛집 목록</a>
    <a href="./index.html">지역별 리뷰</a>
  </nav>
  <main>
    <div class="empty">비어있으면 심심하죠?ㄹㅇㅋㅋ</div>
  </main>
 <footer>
            <div class="footer-left">
                <div class="footer-logo">
                    맛집소개
                </div>
                <p>
                    천안 맛집 큐레이션 서비스
                </p>
            </div>

            <div class="footer-center">
                <p>대표 : 김맛집 | 사업자등록번호 : 123-45-67890</p>
                <p>주소 : 서울특별시 마포구 맛집로 42길 7, 3층</p>
                <p>고객센터 : 02-1234-5678 | matzip@example.com</p>
            </div>

            <div class="footer-right">
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
                <a href="#">문의하기</a>
                <p>© 2026 맛집소개. All rights reserved.</p>
            </div>
        </footer>
</body>

</html>
